<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Record Card</title>
    <!-- Tailwind CSS CDN for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .perspective-1000 {
            perspective: 1000px;
        }
        .transform-style-3d {
            transform-style: preserve-3d;
        }
        .backface-hidden {
            backface-visibility: hidden;
        }
        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        /* Default state for all decay targets */
        .decay-target {
            transition: filter 15s ease-out, opacity 15s ease-out, letter-spacing 15s ease-out;
            filter: blur(0px);
            opacity: 1;
            letter-spacing: normal;
        }

        /* Specific decay for standard fields (15s total) */
        .decay-active .decay-target:not(.decay-delayed) {
            filter: blur(5px);
            opacity: 0.2;
            letter-spacing: 0.25em;
        }

        /* Delayed decay for "What was not captured" (stays sharp for ~13s, decays in the final 2s) */
        .decay-active .decay-delayed {
            transition: filter 2s ease-in 13s, opacity 2s ease-in 13s, letter-spacing 2s ease-in 13s;
            filter: blur(5px);
            opacity: 0.2;
            letter-spacing: 0.25em;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-orange-50/50 to-sky-50 flex items-center justify-center min-h-screen m-0 p-4">

    <!-- Card Container with Perspective -->
    <div class="w-[460px] h-[520px] perspective-1000">
        <!-- Flippable Inner Card -->
        <div id="cardInner" class="relative w-full h-full duration-700 transform-style-3d shadow-xl rounded-3xl transition-transform">
            
            <!-- Front Face (Fresh & Happy Style) -->
            <div class="absolute inset-0 w-full h-full bg-gradient-to-b from-white to-amber-50/30 text-slate-800 rounded-3xl border border-amber-200/60 p-7 flex flex-col justify-between box-border backface-hidden shadow-sm">
                <!-- Top Section: Image Placeholder & Typography -->
                <div class="flex flex-col">
                    <!-- Large Image Container -->
                    <div id="frontImageContainer" class="w-full h-56 bg-gradient-to-tr from-amber-100/60 to-emerald-100/60 rounded-2xl border-2 border-dashed border-amber-300/80 flex flex-col items-center justify-center text-amber-800/60 mb-5 relative overflow-hidden group">
                        <div class="absolute -right-8 -top-8 w-24 h-24 bg-yellow-200/40 rounded-full blur-xl"></div>
                        <svg class="w-10 h-10 mb-2 stroke-1.5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <span id="frontImageText" class="text-sm font-semibold tracking-wide text-amber-800/80">Loading Photo...</span>
                    </div>

                    <!-- Title -->
                    <h2 id="frontTitle" class="text-xl font-bold text-slate-800 tracking-tight mb-1 flex items-center gap-2">
                        <span>Loading...</span>
                        <span class="inline-block animate-bounce">✨</span>
                    </h2>

                    <!-- Place (Smaller Grey Text below title) -->
                    <p id="frontPlace" class="text-sm text-slate-500 leading-relaxed font-normal">
                        Loading place...
                    </p>
                </div>

                <!-- Bottom Section: Archive Button -->
                <div>
                    <button onclick="flipCard()" class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-600 hover:to-orange-600 text-white font-semibold rounded-2xl transition-all duration-200 shadow-md shadow-amber-500/20 focus:outline-none focus:ring-2 focus:ring-amber-400 focus:ring-offset-2 tracking-wide text-sm">
                        Archive this memory 🌻
                    </button>
                </div>
            </div>

            <!-- Back Face (Archival Specimen Label with Selective Sharpness & Delayed Decay) -->
            <div id="backFace" class="absolute inset-0 w-full h-full bg-[#fdfcf7] text-[#4a453d] rounded-3xl border border-[#e3ded2] p-7 flex flex-col justify-between box-border backface-hidden rotate-y-180 font-mono shadow-sm">
                
                <!-- Specimen Header & Catalog Number (Sharp) -->
                <div>
                    <div class="flex justify-between items-center border-b border-[#e3ded2] pb-3 mb-3">
                        <span class="text-xs uppercase tracking-widest text-[#8c8273]">Archival Specimen</span>
                        <span id="backCatalog" class="text-xs font-semibold text-[#5c5448]">CAT. NO. #...</span>
                    </div>
                </div>

                <!-- Fields Layout -->
                <div id="specimenFields" class="flex flex-col justify-start gap-4 flex-grow py-1 text-xs">
                    <div>
                        <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">Title</span>
                        <span id="backTitle" class="text-[#332f28] font-medium decay-target inline-block">Loading...</span>
                    </div>
                    <div>
                        <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">Date and place</span>
                        <span id="backDatePlace" class="text-[#332f28] decay-target inline-block">Loading...</span>
                    </div>
                    <div>
                        <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">Recorded by</span>
                        <span id="backRecorder" class="text-[#332f28] decay-target inline-block">Loading...</span>
                    </div>
                    <div>
                        <span class="text-[#9e9485] block uppercase tracking-wider text-[10px] mb-0.5">What was not captured</span>
                        <span id="backNotCaptured" class="text-[#5c5448] leading-relaxed block text-[11px] decay-target decay-delayed">Loading...</span>
                    </div>
                </div>

                <!-- Flip Back Button -->
                <div>
                    <button onclick="flipCard()" class="w-full py-2.5 px-4 bg-[#e8e4db] hover:bg-[#ded9cc] text-[#4a453d] font-medium rounded-xl transition-all duration-200 border border-[#d8d1c2] text-xs uppercase tracking-wider focus:outline-none">
                        Flip back
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Function to load and populate data from record.json
        const loadRecordData = () => {
            const populateData = (data) => {
                if (data.title) {
                    document.getElementById('frontTitle').querySelector('span').textContent = data.title;
                    document.getElementById('backTitle').textContent = data.title;
                }
                if (data.catalog_id) {
                    document.getElementById('backCatalog').textContent = `CAT. NO. ${data.catalog_id}`;
                }
                if (data.date && data.place) {
                    document.getElementById('backDatePlace').textContent = `${data.date} / ${data.place}`;
                } else if (data.date) {
                    document.getElementById('backDatePlace').textContent = data.date;
                } else if (data.place) {
                    document.getElementById('backDatePlace').textContent = data.place;
                }
                if (data.place) {
                    document.getElementById('frontPlace').textContent = data.place;
                }
                if (data.recorder) {
                    document.getElementById('backRecorder').textContent = data.recorder;
                }
                if (data.not_captured) {
                    document.getElementById('backNotCaptured').textContent = data.not_captured;
                }
                if (data.image) {
                    const container = document.getElementById('frontImageContainer');
                    container.style.backgroundImage = `url('${data.image}')`;
                    container.style.backgroundSize = 'cover';
                    container.style.backgroundPosition = 'center';
                    const textEl = document.getElementById('frontImageText');
                    if (textEl) textEl.style.display = 'none';
                    const svgEl = container.querySelector('svg');
                    if (svgEl) svgEl.style.display = 'none';
                }
            };

            // Attempt fetch, handle blob URLs and local server fetching correctly
            const targetUrl = (window.location.protocol.startsWith('blob') ? 'record.json' : './record.json') + '?t=' + new Date().getTime();
            fetch(targetUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(data => populateData(data))
                .catch(err => {
                    // Replace the entire page body with the requested monospace error message if fetch fails
                    document.body.innerHTML = `
                        <div style="font-family: monospace; display: flex; align-items: center; justify-content: center; height: 100vh; padding: 2rem; text-align: center; color: #333; background: #fdfcf7;">
                            <p>record.json did not load. Are you serving the folder? Open http://localhost:8000</p>
                        </div>
                    `;
                });
        };

        // Load data on initial page load
        window.addEventListener('DOMContentLoaded', () => {
            loadRecordData();
            // Automatically poll record.json every 2 seconds to instantly reflect changes when you edit the JSON file
            setInterval(loadRecordData, 2000);
        });

        let isFlipped = false;
        function flipCard() {
            const cardInner = document.getElementById('cardInner');
            const specimenFields = document.getElementById('specimenFields');
            isFlipped = !isFlipped;
            
            if (isFlipped) {
                cardInner.classList.add('rotate-y-180');
                // Trigger decay animation specifically on the fields container
                setTimeout(() => {
                    specimenFields.classList.add('decay-active');
                }, 100);
            } else {
                cardInner.classList.remove('rotate-y-180');
                // Reset decay animation instantly when flipping back
                specimenFields.classList.remove('decay-active');
            }
        }
    </script>
</body>
</html>
